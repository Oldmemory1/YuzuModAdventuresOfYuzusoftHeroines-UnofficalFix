 pc_yuzu_abyss_ringworld:0"深渊环世界"
 pc_yuzu_abyss_ringworld_desc:0"这座环世界区段沿用旧深渊文明留下的加工环结构。重新点燃后，它保留原版环形世界的住房与区段框架。"
 pc_yuzu_sunset_ringworld:0"夕阳环世界"
 pc_yuzu_sunset_ringworld_desc:0"这座环世界区段被幻梦境的暮色所笼罩。它的住房与区段框架与原版环形世界一致。"

 decision_yuzu_abyss_ringworld:0"建设深渊环世界"
 decision_yuzu_abyss_ringworld_desc:0"与旧深渊文明留下的环世界结构共鸣，将这座可殖民环形世界区段改造为深渊环世界。"
 decision_yuzu_abyss_ringworld_effects:1 "将星球变成§Y深渊环世界§!，保留原版环形世界的§Y住房区段§!，并解锁§Y深渊环世界未特化区段§!（等待柚子特化）。"
 decision_yuzu_sunset_ringworld:0"建设夕阳环世界"
 decision_yuzu_sunset_ringworld_desc:0"把幻梦境的投影延伸至这座环形世界区段，将其改造为夕阳环世界。"
 decision_yuzu_sunset_ringworld_effects:1 "将星球变成§Y夕阳环世界§!，保留原版环形世界的§Y住房区段§!，并解锁§Y夕阳环世界未特化区段§!（等待柚子特化）。"

