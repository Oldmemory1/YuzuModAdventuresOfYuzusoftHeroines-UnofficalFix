 tech_yuzu_armor_1:0"世界装甲"
 tech_yuzu_armor_1_desc:0"包含了一个微型世界的装甲，摧毁它等于要摧毁一个世界。"
 tech_yuzu_armor_1_advanced:0"先进世界装甲"
 tech_yuzu_armor_1_advanced_desc:0"先进世界装甲把微型世界的质量压缩得更为致密，防护更厚，对穿透攻击的抵御也更强。"
 tech_yuzu_armor_1_elite:0"精英世界装甲"
 tech_yuzu_armor_1_elite_desc:0"精英世界装甲以活体金属为骨架，受损的装甲会自行弥合；运转时还需持续供给稀有水晶。"
 tech_yuzu_armor_2:0"深渊装甲"
 tech_yuzu_armor_2_desc:0"利用深渊中的物质制造的装甲，坚不可摧。"
 tech_yuzu_crystal_armor_1:0"世界镀层"
 tech_yuzu_crystal_armor_1_desc:0"将水晶熔入船壳，在增强船体强度的同时削减所受伤害。"
 tech_yuzu_crystal_armor_2:0"深渊镀层"
 tech_yuzu_crystal_armor_2_desc:0"将深渊中的物质熔铸锻入船体，赋予舰船远超常规的坚韧与减伤。"
 tech_yuzu_shield_1:0"时空屏障"
 tech_yuzu_shield_1_desc:0"通过扭曲舰船周围的时空来隔绝攻击，几乎无懈可击。"
 tech_yuzu_shield_1_advanced:0"先进时空屏障"
 tech_yuzu_shield_1_advanced_desc:0"先进时空屏障把扭曲场收束得更加致密，防护更厚、恢复更快，对穿透攻击的抵御也更强。"
 tech_yuzu_shield_1_elite:0"精英时空屏障"
 tech_yuzu_shield_1_elite_desc:0"精英时空屏障的扭曲场近乎凝固，防护与自愈都远超先进型号，只是运转时要持续注入异星天然气。"
 tech_yuzu_shield_2:0"深渊之护"
 tech_yuzu_shield_2_desc:0"借用深渊之力形成的守护屏障，几乎可以抵挡一切攻击。"

