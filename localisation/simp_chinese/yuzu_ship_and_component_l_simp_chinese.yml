 tech_yuzu_jump_drive_1:0"空间折跃引擎"
 tech_yuzu_jump_drive_1_desc:0"利用对空间的了解，我们可以进行范围更广阔的折跃。"
 tech_thrusters_yuzu_1:0"时空涡流推进器"
 tech_thrusters_yuzu_1_desc:0"通过制造时空涡流，舰船可以获得超越常理的速度。"
 tech_computer_role_yuzu:0"时空分析接口"
 tech_computer_role_yuzu_desc:0"通过分析整片战场的时空波动来指挥舰船，几乎能预知敌方的行动。"
 tech_fire_control_yuzu:0"时空感知水晶"
 tech_fire_control_yuzu_desc:0"能感知战场的每一处细节，辅助舰船做出更准确的判断。"
 tech_sensors_yuzu_1:0"时空传感器"
 tech_sensors_yuzu_1_desc:0"利用对时空波动的探测，我们可以获知更加遥远的星系的信息。"
 tech_sensors_yuzu_2:0"深渊洞察仪"
 tech_sensors_yuzu_2_desc:0"直接召唤位于更高位面的深渊之力对宇宙进行洞察。"
 tech_sensors_yuzu_1_advanced:0"先进时空传感器"
 tech_sensors_yuzu_1_advanced_desc:0"先进型号。采样精度更高，能看得更远。"
 tech_sensors_yuzu_1_elite:0"精英时空传感器"
 tech_sensors_yuzu_1_elite_desc:0"精英型号。能在更远的距离上先敌一步锁定目标。"
 tech_reactor_yuzu_3:0"深渊炉心"
 tech_reactor_yuzu_3_desc:0"深渊炉心吸取深渊之力，源源不断地产生庞大的能量。"
