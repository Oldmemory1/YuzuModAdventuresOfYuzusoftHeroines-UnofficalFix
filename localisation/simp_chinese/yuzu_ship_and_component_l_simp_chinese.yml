 tech_yuzu_star_eater:0"堕天神兵"
 tech_yuzu_star_eater_desc:0"$tech_yuzu_star_eater$是深渊教廷的王牌战舰，既能引爆恒星、毁灭整个恒星系，也能单独匹敌一支大型舰队。我们目前只能仿制出一艘。"
 TECH_UNLOCK_YUZU_STAR_EATER_CONSTRUCTION_TITLE:0"§H解锁舰船类型：§!$tech_yuzu_star_eater$"
 TECH_UNLOCK_YUZU_STAR_EATER_CONSTRUCTION_DESC:0"$tech_yuzu_star_eater$是深渊教廷的王牌战舰，既能引爆恒星、毁灭整个恒星系，也能单独匹敌一支大型舰队。"

 yuzu_star_eater_cap:0"$yuzu_star_eater$"
 yuzu_star_eater:0"$tech_yuzu_star_eater$"
 yuzu_star_eater_plural:0"堕天神兵"
 SHIP_YUZU_STAR_EATER_SECTION:0"$tech_yuzu_star_eater$"
 SHIP_GRAPHICS_YUZU_STAR_EATER_DESC:0"深渊教廷仿制出的恒星级巨舰。它携带的武器能引爆恒星，也能单独对抗一支大型舰队。"

 
 tech_pk_back_in_time:0"时光倒流"
 tech_pk_back_in_time_desc:0"$PLANET_KILLER_BACK_IN_TIME_DESC$"

 PLANET_KILLER_BACK_IN_TIME:0"时光倒流"
 PLANET_KILLER_BACK_IN_TIME_ACTION:0"回溯"
 PLANET_KILLER_BACK_IN_TIME_DESC:0"一个庞大的时间力场将会笼罩在星球表面，并倒流整个星球的时间。"
 FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_BACK_IN_TIME:0 "正在准备回溯$PLANET|Y$"
 MESSAGE_DESC_FOR_PLANET_KILLER_BACK_IN_TIME:0"回到了遥远的过去"
 yuzu_no_right_back_in_time:"目标不在他国境内，且为无主或土著星球"
 yuzu_back_primitives_not_xenophobe:0"§R$TRIGGER_FAIL$我们没有排外主义或极端排外主义思潮，无法回溯土著§!"
 yuzu_can_not_back_because_pc_ai_1:0"§R$TRIGGER_FAIL$这颗人工智能星球的存在时间过于久远，时光倒流恐怕无济于事§!"
 yuzu_can_not_back_because_pc_ai_2:0"§R$TRIGGER_FAIL$极度危险！这颗星球曾经是肃正协议的人工智能星球！§!"
 can_not_back_in_time:0"§R$TRIGGER_FAIL$目标无法回溯§!"
 PLANET_KILLER_STAR_CRACKER_YUZU:0"星爆器"
 PLANET_KILLER_STAR_CRACKER_YUZU_ACTION:0 "引爆恒星"
 PLANET_KILLER_STAR_CRACKER_YUZU_DESC:1 "一束定向的快子能量被注入到这颗恒星，引发了一次超新星爆炸。§R这次事件释放的巨额能量会使得恒星系内的所有殖民地，巨型结构和空间站都被摧毁。只有$tech_yuzu_star_eater$能够幸免于难。§!"
 FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_STAR_CRACKER_YUZU:0 "正在准备击碎$PLANET|Y$"

 
 tech_yuzu_l_1:0"时空乱流发射器"
 tech_yuzu_l_1_desc:0"发射撕裂的时空乱流，无视护盾与装甲，直接破坏舰体内部结构。"
 tech_yuzu_l_2:0"毁灭魔音"
 tech_yuzu_l_2_desc:0"仿佛自深渊而来的高能能量团。它能轻易啃穿装甲与舰体，却几乎无法撼动能量护盾。"
 tech_yuzu_l_3:0"恐惧魔音"
 tech_yuzu_l_3_desc:0"比毁灭魔音更凝实的深渊能量。破甲与破体的威力更强，对能量护盾依然无能为力。"
 tech_yuzu_lance_1:0"时空粉碎者"
 tech_yuzu_lance_1_desc:0"轴基武器。强大的时空能量无视护盾与装甲，直接粉碎目标所在的时空。"
 tech_yuzu_lance_2:0"深渊救赎"
 tech_yuzu_lance_2_desc:0"深渊巨矛。贯穿装甲与舰体时毫不留情，却几乎无法穿透能量护盾。"
 tech_yuzu_lance_3:0"深渊挽歌"
 tech_yuzu_lance_3_desc:0"深渊救赎的强化版。对装甲与舰体的贯穿比救赎更彻底，依旧穿不透能量护盾。"
 tech_yuzu_beam_1:0"湮灭巨炮"
 tech_yuzu_beam_1_desc:0"恐怖的时空能量射线无视护盾与装甲，沿途的一切都会连同其所在的时空一同湮灭。"
 tech_yuzu_beam_2:0"末日序曲"
 tech_yuzu_beam_2_desc:0"深渊巨炮的射线。它能轻易焚毁装甲与舰体，却会被能量护盾挡下。"
 tech_yuzu_beam_3:0"末日终章"
 tech_yuzu_beam_3_desc:0"比序曲更强的深渊射线。对装甲与舰体的杀伤更重，依旧穿透不了能量护盾。"
 tech_yuzu_strike_craft_1:0"深渊使徒"
 tech_yuzu_strike_craft_1_desc:0"深渊的使徒。这些舰载机以深渊能量攻击敌舰，对装甲与舰体格外有效，对能量护盾则效果不佳。"
 tech_yuzu_torpedoes_1:0"庭达罗斯之牙"
 tech_yuzu_torpedoes_1_desc:0"如同庭达罗斯之猎犬般追猎目标的鱼雷。它装有护盾调制器，可穿过能量护盾，对装甲与舰体造成巨额伤害。"
 tech_yuzu_pd_tracking_1:0"深渊之壁"
 tech_yuzu_pd_tracking_1_desc:0"深渊之壁。以深渊能量织成的拦截网，用于击落来袭的导弹与舰载机。"

 tech_yuzu_repeatable_spacetime_turbulence_damage:0"乱流聚焦阵列"
 tech_yuzu_repeatable_spacetime_turbulence_damage_desc:0"持续精进时空乱流武器的聚焦构型，让每一次时空撕裂都更为致命。"
 tech_yuzu_repeatable_spacetime_turbulence_fire_rate:0"乱流过载冷却"
 tech_yuzu_repeatable_spacetime_turbulence_fire_rate_desc:0"优化时空乱流发射器的冷却循环，让毁灭的浪潮降临得更加频繁。"
 tech_yuzu_repeatable_abyss_damage:0"深渊撕裂阵列"
 tech_yuzu_repeatable_abyss_damage_desc:0"持续精进深渊武器的聚焦构型，让深渊的怒涛撕裂得更为彻底。"
 tech_yuzu_repeatable_abyss_fire_rate:0"深渊过载冷却"
 tech_yuzu_repeatable_abyss_fire_rate_desc:0"优化深渊武器的冷却循环，让深渊的浪潮冲刷得更加频繁。"
 tech_yuzu_repeatable_resource_storage:0"无尽仓储"
 tech_yuzu_repeatable_resource_storage_desc:0"以深渊教廷的仓储技术为基，持续扩张星海仓廪，让国家的资源储备浩瀚无边。每级资源容量 §G+500000§!"

