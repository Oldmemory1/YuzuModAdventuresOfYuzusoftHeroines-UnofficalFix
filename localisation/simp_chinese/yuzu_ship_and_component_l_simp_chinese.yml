 tech_yuzu_lance_1_desc:0"强大的时空能量将会无视一切阻碍，直接粉碎目标所在的时空。"
 tech_yuzu_lance_2:0"深渊救赎"
 tech_yuzu_lance_2_desc:0"这是深渊对敌人的救赎。"
 tech_yuzu_lance_3:0"深渊挽歌"
 tech_yuzu_lance_3_desc:0"这是深渊为敌人而唱的挽歌。"
 tech_yuzu_beam_1:0"湮灭巨炮"
 tech_yuzu_beam_1_desc:0"恐怖的时空能量射线将会把沿途经过的一切连同其所在的时空一同湮灭。"
 tech_yuzu_beam_2:0"末日序曲"
 tech_yuzu_beam_2_desc:0"这道光，奏响末日的序曲。"
 tech_yuzu_beam_3:0"末日终章"
 tech_yuzu_beam_3_desc:0"这道光，奏响末日的终章。"
