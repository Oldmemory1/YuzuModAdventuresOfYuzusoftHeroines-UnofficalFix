 #===== 失落建筑：新增建筑条目的名称与描述（tier3~5 与实验室/娱乐线）=====

 building_yuzu_nourishment_center_tier_3:0 "幽馥圣殿"
 building_yuzu_nourishment_center_tier_3_desc:0 "复现网络沿穹顶铺设，把风味与气候一并纳入调配范围。随着网络在行星各处成形，全星的宜居度同步上升。"
 building_yuzu_nourishment_center_tier_4:0 "赤醴圣殿"
 building_yuzu_nourishment_center_tier_4_desc:0 "菌毯与复现回路相互交织，把行星季风也纳入了可改写的循环，作物与环境在其中都能获得超出常规的生长条件。"
 building_yuzu_nourishment_center_tier_5:0 "琼筵之枢"
 building_yuzu_nourishment_center_tier_5_desc:0 "复现流的覆盖范围扩展至全星，使其长期维持在丰饶的盛季；风味与气候在此都可被随时重新配置。"
 building_yuzu_fe_mine_tier_3:0 "星核脉动矩阵"
 building_yuzu_fe_mine_tier_3_desc:0 "隧穿井架沿地幔脉络次第点亮，把矿脉的分布与压力变化实时读入阵列，无接触抽取的效率与连续性进一步提高。"
 building_yuzu_fe_mine_tier_4:0 "星核熔脉枢纽"
 building_yuzu_fe_mine_tier_4_desc:0 "采掘网络延伸至地核以上的每一层岩壳，行星内部的热流被稳定地转化为持续的矿物产出。"
 building_yuzu_fe_mine_tier_5:0 "星脉终枢"
 building_yuzu_fe_mine_tier_5_desc:0 "采掘井网覆盖整颗行星的矿脉，自地心向外持续输运矿物与熔流，基本不再受地层结构的限制。"
 building_yuzu_affluence_center_tier_3:0 "幽裕圣殿"
 building_yuzu_affluence_center_tier_3_desc:0 "预测系统与复现回路融为一体，珍稀物资的成形时间被压缩到接近瞬时；整座殿堂可在没有外部补给的情况下自我充盈。"
 building_yuzu_affluence_center_tier_4:0 "赤瑛圣殿"
 building_yuzu_affluence_center_tier_4_desc:0 "物质在复现与回收之间几乎不留损耗，获取财富的流程被简化为检索与确认两个步骤。"
 building_yuzu_affluence_center_tier_5:0 "丰饶终殿"
 building_yuzu_affluence_center_tier_5_desc:0 "全星的物质需求都在此汇总并即时兑现，循环过程中的损耗已被压到可以忽略的水平。"
 building_yuzu_dimensional_fabricator_tier_3:0 "多重次元织造矩阵"
 building_yuzu_dimensional_fabricator_tier_3_desc:0 "织造线程把维度织构编成一张可反复汲取的网，战略资源的产出几乎不再中断。"
 building_yuzu_dimensional_fabricator_tier_4:0 "多重次元熔铸枢纽"
 building_yuzu_dimensional_fabricator_tier_4_desc:0 "次元裂纹在枢纽中央反复张合，多种稀有资源沿同一条通道稳定析出，产量与种类同步提升。"
 building_yuzu_dimensional_fabricator_tier_5:0 "次元织枢"
 building_yuzu_dimensional_fabricator_tier_5_desc:0 "维度线束在枢纽内纵横交错，等同于把通向所有次元的走廊折进同一座建筑，资源自此持续析出。"
 building_yuzu_fe_dome_tier_3:0 "苍碧穹顶"
 building_yuzu_fe_dome_tier_3_desc:0 "反重力穹幕自地面缓缓升起，把整座城市托举至云层之上；居住区由此摆脱了地形与地质灾害的限制。"
 building_yuzu_fe_dome_tier_4:0 "赤霄穹顶"
 building_yuzu_fe_dome_tier_4_desc:0 "浮空城市在失重天幕下持续扩张，居住密度与面积同步提升，地面的环境压力被大幅转移。"
 building_yuzu_fe_dome_tier_5:0 "万象天穹"
 building_yuzu_fe_dome_tier_5_desc:0 "穹幕覆盖整片天空，整颗行星被托入不受重力约束的生境，居民的居住与舒适需求由系统统一供给。"
 building_yuzu_fe_stronghold_tier_3:0 "玄垒基地"
 building_yuzu_fe_stronghold_tier_3_desc:0 "抑制场自环形基座升起，军械库与护盾层被整合为统一系统，接近行星的舰队会在第一时间被防线探测并锁定。"
 building_yuzu_fe_stronghold_tier_4:0 "赤垒要塞"
 building_yuzu_fe_stronghold_tier_4_desc:0 "护盾在轨道高度凝成一道连续的环，上古武器沿塔尖展开布防，行星天空被纳入一道无法绕行的火墙。"
 building_yuzu_fe_stronghold_tier_5:0 "不落圣垒"
 building_yuzu_fe_stronghold_tier_5_desc:0 "护盾覆盖整颗行星并与上古军械库联动，防御纵深与持续作战能力均已达到该体系的极限。"
 building_yuzu_fe_market_tier_3:0 "星河贸易圣枢"
 building_yuzu_fe_market_tier_3_desc:0 "贸易回路沿尖顶盘旋而上，商路在星图上自行收束成网；行星上流通的每一件货物都在同一道枢纽里换手。"
 building_yuzu_fe_market_tier_4:0 "赤澜贸易圣殿"
 building_yuzu_fe_market_tier_4_desc:0 "货流在殿内持续奔涌，每一次成交都被折算成可以再投资的资本，观测范围内的星域几乎都在此挂牌交易。"
 building_yuzu_fe_market_tier_5:0 "星域商枢"
 building_yuzu_fe_market_tier_5_desc:0 "整片星域的货物都要经由这座枢纽换手，它本身就是一座设立在轨道上的市场。"
 building_yuzu_fe_clinic_tier_3:0 "幽微再生圣所"
 building_yuzu_fe_clinic_tier_3_desc:0 "再生溶液在培养腔中循环，创口与衰老被逐层还原为尚未发生的误差；健康从被治疗的对象转为被长期维护的日常。"
 building_yuzu_fe_clinic_tier_4:0 "赤髓再生圣殿"
 building_yuzu_fe_clinic_tier_4_desc:0 "再生髓流贯穿整座殿堂，寿命不再是医学追求的目标，而只是可以调校的刻度，全星健康水平借此一并抬升。"
 building_yuzu_fe_clinic_tier_5:0 "再生终殿"
 building_yuzu_fe_clinic_tier_5_desc:0 "再生疗程覆盖整座殿堂，寿命成为一种可以被反复延长的状态，居民健康被稳定维持在最理想的区间。"
 building_yuzu_fe_lab_tier_1:0 "量子创研枢纽"
 building_yuzu_fe_lab_tier_1_desc:0 "汇集最先进设备与空前人力规模的研究枢纽。量子理论在此不再只是被探讨的对象，而是被转化为可以落地的技术成果。"
 building_yuzu_fe_lab_tier_2:0 "超验研理圣殿"
 building_yuzu_fe_lab_tier_2_desc:0 "站在科学进步顶点的研究机构。它把“不可解”列入待办事项，见证着一个创造无远弗届的时代。"
 building_yuzu_fe_lab_tier_3:0 "幽玄推演矩阵"
 building_yuzu_fe_lab_tier_3_desc:0 "假说在演算矩阵中被成批地提出、推翻与重建；知识不再是缓慢的积累，而是一条可以被加速的产线。"
 building_yuzu_fe_lab_tier_4:0 "赤曜真知圣所"
 building_yuzu_fe_lab_tier_4_desc:0 "经过验证的规律在穹顶下凝结成可以反复调用的公理，全星的思维资源都在为同一批问题让路。"
 building_yuzu_fe_lab_tier_5:0 "公理之枢"
 building_yuzu_fe_lab_tier_5_desc:0 "文明所掌握的全部公理在此归档并可即时调用，研究流程本身已被压缩到接近极限。"
 building_yuzu_fe_entertainment_tier_1:0 "虚境欢愉广场"
 building_yuzu_fe_entertainment_tier_1_desc:0 "这片庞大的娱乐区段处于休闲产业的最前沿，脑波读取技术可为每位居民生成即时、个性化的虚拟度假体验。"
 building_yuzu_fe_entertainment_tier_2:0 "极乐枢纽"
 building_yuzu_fe_entertainment_tier_2_desc:0 "娱乐产业的顶峰。这座枢纽超越了常规限制，居民的所有愿望在许下之前就已经被实现。"
 building_yuzu_fe_entertainment_tier_3:0 "幽梦欢愉圣殿"
 building_yuzu_fe_entertainment_tier_3_desc:0 "梦境光幕覆盖各大厅，娱乐体验被编成可以反复回放的序列，进入者不再受疲劳影响。"
 building_yuzu_fe_entertainment_tier_4:0 "赤霞极乐圣所"
 building_yuzu_fe_entertainment_tier_4_desc:0 "愉悦不再需要被制造，只需要被允许；连行星的作息都为这场不散的庆典让开道路。"
 building_yuzu_fe_entertainment_tier_5:0 "极乐终殿"
 building_yuzu_fe_entertainment_tier_5_desc:0 "娱乐需求在整片城区被统一承接，愉悦的供给不再有上限，全星长期处于同一场庆典之中。"

 #===== 失落建筑：解锁科技（名称与描述沿用其建筑）=====

 tech_building_yuzu_class_4_singularity_tier_1:0 "五级奇点"
 tech_building_yuzu_class_4_singularity_tier_1_desc:0 "无人能够完全理解其原理的全自动发电设施。超大型隔离场把奇点约束在稳定能级，能量以恒定速率被抽取并并入电网。"
 tech_building_yuzu_class_4_singularity_tier_2:0 "六级奇点"
 tech_building_yuzu_class_4_singularity_tier_2_desc:0 "更强的隔离场把奇点推向更高能级。能量产出已逼近物理学容许的极限，而约束结构反而比以往任何时候都更加稳固。"
 tech_building_yuzu_class_4_singularity_tier_3:0 "七级奇点"
 tech_building_yuzu_class_4_singularity_tier_3_desc:0 "谐振环自隔离场深处生长而出，沿合金塔架缠绕成型，使奇点与整座阵列的运行频率保持一致，能量输出由此变得平稳而绵长。"
 tech_building_yuzu_class_4_singularity_tier_4:0 "八级奇点"
 tech_building_yuzu_class_4_singularity_tier_4_desc:0 "塔顶持续倾泻高温能量流，把整座阵列烧灼成一座不熄的熔炉。其存在感之强，即便远距离观测也足以令人却步。"
 tech_building_yuzu_class_4_singularity_tier_5:0 "九级奇点"
 tech_building_yuzu_class_4_singularity_tier_5_desc:0 "奇点链路的最终形态。能量洪流被完全纳入回路，输出规模已接近行星级工程的上限。"
 tech_building_yuzu_nourishment_center_tier_1:0 "营养圣殿"
 tech_building_yuzu_nourishment_center_tier_1_desc:0 "以复制科技即时重构风味的自动化膳食设施。任何已知的味道都可在命令下达后迅速重现。"
 tech_building_yuzu_nourishment_center_tier_2:0 "琼浆圣殿"
 tech_building_yuzu_nourishment_center_tier_2_desc:0 "只要心念所至，珍馐便会自行汇聚。殿内深处的复现泉能够识别进食者的需求，把最偏门的味觉诉求化为可即时上桌的盛宴，并顺带改善局部气候。"
 tech_building_yuzu_nourishment_center_tier_3:0 "幽馥圣殿"
 tech_building_yuzu_nourishment_center_tier_3_desc:0 "复现网络沿穹顶铺设，把风味与气候一并纳入调配范围。随着网络在行星各处成形，全星的宜居度同步上升。"
 tech_building_yuzu_nourishment_center_tier_4:0 "赤醴圣殿"
 tech_building_yuzu_nourishment_center_tier_4_desc:0 "菌毯与复现回路相互交织，把行星季风也纳入了可改写的循环，作物与环境在其中都能获得超出常规的生长条件。"
 tech_building_yuzu_nourishment_center_tier_5:0 "琼筵之枢"
 tech_building_yuzu_nourishment_center_tier_5_desc:0 "复现流的覆盖范围扩展至全星，使其长期维持在丰饶的盛季；风味与气候在此都可被随时重新配置。"
 tech_building_yuzu_fe_mine_tier_1:0 "星核采矿阵"
 tech_building_yuzu_fe_mine_tier_1_desc:0 "通过行星地幔锁定矿脉的量子隧穿采掘阵列。钻具在不与岩层发生物理接触的前提下穿透固体材料，持续输出矿物。"
 tech_building_yuzu_fe_mine_tier_2:0 "星核钻穿枢纽"
 tech_building_yuzu_fe_mine_tier_2_desc:0 "隧穿井架可直达外地核以上的全部岩层与熔浆界面，矿物被无接触地连续抽出；整座阵列已升级为行星矿脉的中央采掘枢纽。"
 tech_building_yuzu_fe_mine_tier_3:0 "星核脉动矩阵"
 tech_building_yuzu_fe_mine_tier_3_desc:0 "隧穿井架沿地幔脉络次第点亮，把矿脉的分布与压力变化实时读入阵列，无接触抽取的效率与连续性进一步提高。"
 tech_building_yuzu_fe_mine_tier_4:0 "星核熔脉枢纽"
 tech_building_yuzu_fe_mine_tier_4_desc:0 "采掘网络延伸至地核以上的每一层岩壳，行星内部的热流被稳定地转化为持续的矿物产出。"
 tech_building_yuzu_fe_mine_tier_5:0 "星脉终枢"
 tech_building_yuzu_fe_mine_tier_5_desc:0 "采掘井网覆盖整颗行星的矿脉，自地心向外持续输运矿物与熔流，基本不再受地层结构的限制。"
 tech_building_yuzu_nano_forge_tier_1:0 "混沌熔炉"
 tech_building_yuzu_nano_forge_tier_1_desc:0 "巨型真空混沌熔炼装置。原材料在此被高效转化为性能远超常规冶炼工艺的高端合金。"
 tech_building_yuzu_nano_forge_tier_2:0 "万象熔炉"
 tech_building_yuzu_nano_forge_tier_2_desc:0 "巨型纳米复制机舱把原材料压入近乎真空的炼造循环，合金以多种形态连续凝结；整座熔炉同时开始承担行星结构的维护负荷。"
 tech_building_yuzu_nano_forge_tier_3:0 "九曜熔炉"
 tech_building_yuzu_nano_forge_tier_3_desc:0 "熔炼回路自炉心向外蔓延，把整座铸造矩阵改造成一具持续运转的熔炉；合金产出的纯度与细腻度进一步提升。"
 tech_building_yuzu_nano_forge_tier_4:0 "真阳熔炉"
 tech_building_yuzu_nano_forge_tier_4_desc:0 "炉火汇聚成不熄的熔炼之河。任何投入其中的材料都会被淬炼至极致纯度，行星结构的维护负荷也由整座熔炉分担。"
 tech_building_yuzu_nano_forge_tier_5:0 "万象终熔"
 tech_building_yuzu_nano_forge_tier_5_desc:0 "整片铸造矩阵由同一股热流贯穿，合金产线已无可见瓶颈；行星结构的维护负荷被完全纳入其循环。"
 tech_building_yuzu_affluence_center_tier_1:0 "财富圣殿"
 tech_building_yuzu_affluence_center_tier_1_desc:0 "无论多奇特的材料，都可以在这里迅速找到。先进的采购算法会在需求被意识到之前完成备货。"
 tech_building_yuzu_affluence_center_tier_2:0 "丰饶圣殿"
 tech_building_yuzu_affluence_center_tier_2_desc:0 "欲望预测与物质复现系统协同运转，几乎任何奇珍异宝都能在转念之间被调集出来；整座圣殿本身就是一座持续的丰饶之源。"
 tech_building_yuzu_affluence_center_tier_3:0 "幽裕圣殿"
 tech_building_yuzu_affluence_center_tier_3_desc:0 "预测系统与复现回路融为一体，珍稀物资的成形时间被压缩到接近瞬时；整座殿堂可在没有外部补给的情况下自我充盈。"
