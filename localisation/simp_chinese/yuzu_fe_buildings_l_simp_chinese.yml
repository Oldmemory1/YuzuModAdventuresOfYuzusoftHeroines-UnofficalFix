 tech_building_yuzu_fe_dome_tier_3_desc:0 "反重力穹幕自地面缓缓升起，把整座城市托举至云层之上；居住区由此摆脱了地形与地质灾害的限制。"
 tech_building_yuzu_fe_dome_tier_4:0 "赤霄穹顶"
 tech_building_yuzu_fe_dome_tier_4_desc:0 "浮空城市在失重天幕下持续扩张，居住密度与面积同步提升，地面的环境压力被大幅转移。"
 tech_building_yuzu_fe_dome_tier_5:0 "万象天穹"
 tech_building_yuzu_fe_dome_tier_5_desc:0 "穹幕覆盖整片天空，整颗行星被托入不受重力约束的生境，居民的居住与舒适需求由系统统一供给。"
 tech_building_yuzu_fe_stronghold_tier_1:0 "圣盾基地"
 tech_building_yuzu_fe_stronghold_tier_1_desc:0 "规模庞大的行星防御复合体，配备多座储存上古神秘武器的军械库与多层装甲。只有高度特化的攻城部队才可能突破其防御。"
 tech_building_yuzu_fe_stronghold_tier_2:0 "神盾基地"
 tech_building_yuzu_fe_stronghold_tier_2_desc:0 "中央塔尖自环形基座间拔地而起，上古军械库与层层护盾彼此咬合；行星的天空被收进一道无法绕行的防线。"
 tech_building_yuzu_fe_stronghold_tier_3:0 "玄垒基地"
 tech_building_yuzu_fe_stronghold_tier_3_desc:0 "抑制场自环形基座升起，军械库与护盾层被整合为统一系统，接近行星的舰队会在第一时间被防线探测并锁定。"
 tech_building_yuzu_fe_stronghold_tier_4:0 "赤垒要塞"
 tech_building_yuzu_fe_stronghold_tier_4_desc:0 "护盾在轨道高度凝成一道连续的环，上古武器沿塔尖展开布防，行星天空被纳入一道无法绕行的火墙。"
 tech_building_yuzu_fe_stronghold_tier_5:0 "不落圣垒"
 tech_building_yuzu_fe_stronghold_tier_5_desc:0 "护盾覆盖整颗行星并与上古军械库联动，防御纵深与持续作战能力均已达到该体系的极限。"
 tech_building_yuzu_fe_market_tier_1:0 "星系贸易中心"
 tech_building_yuzu_fe_market_tier_1_desc:0 "高耸的塔尖俯瞰整条天际线，为脚下熙攘的商业区投下阴影；行星上流通的货物几乎都要在这里过一道手。"
 tech_building_yuzu_fe_market_tier_2:0 "星际贸易枢纽"
 tech_building_yuzu_fe_market_tier_2_desc:0 "这片贸易区在星系经济中占据着至高无上的地位，庞大的尖顶即便从轨道上也清晰可见。"
 tech_building_yuzu_fe_market_tier_3:0 "星河贸易圣枢"
 tech_building_yuzu_fe_market_tier_3_desc:0 "贸易回路沿尖顶盘旋而上，商路在星图上自行收束成网；行星上流通的每一件货物都在同一道枢纽里换手。"
 tech_building_yuzu_fe_market_tier_4:0 "赤澜贸易圣殿"
 tech_building_yuzu_fe_market_tier_4_desc:0 "货流在殿内持续奔涌，每一次成交都被折算成可以再投资的资本，观测范围内的星域几乎都在此挂牌交易。"
 tech_building_yuzu_fe_market_tier_5:0 "星域商枢"
 tech_building_yuzu_fe_market_tier_5_desc:0 "整片星域的货物都要经由这座枢纽换手，它本身就是一座设立在轨道上的市场。"
 tech_building_yuzu_fe_clinic_tier_1:0 "分子焕活所"
 tech_building_yuzu_fe_clinic_tier_1_desc:0 "分子焕活所深入研究细胞的复杂构造，把病痛与衰老都视为可以修正的误差，显著提高人口的健康质量与预期寿命。"
 tech_building_yuzu_fe_clinic_tier_2:0 "生物再生所"
 tech_building_yuzu_fe_clinic_tier_2_desc:0 "站在医疗技术巅峰的再生研究机构。开创性的再生疗法不断重写生命的界限；在这座殿堂里，衰老只是一个尚未被修正的参数。"
 tech_building_yuzu_fe_clinic_tier_3:0 "幽微再生圣所"
 tech_building_yuzu_fe_clinic_tier_3_desc:0 "再生溶液在培养腔中循环，创口与衰老被逐层还原为尚未发生的误差；健康从被治疗的对象转为被长期维护的日常。"
 tech_building_yuzu_fe_clinic_tier_4:0 "赤髓再生圣殿"
 tech_building_yuzu_fe_clinic_tier_4_desc:0 "再生髓流贯穿整座殿堂，寿命不再是医学追求的目标，而只是可以调校的刻度，全星健康水平借此一并抬升。"
 tech_building_yuzu_fe_clinic_tier_5:0 "再生终殿"
 tech_building_yuzu_fe_clinic_tier_5_desc:0 "再生疗程覆盖整座殿堂，寿命成为一种可以被反复延长的状态，居民健康被稳定维持在最理想的区间。"
 tech_building_yuzu_fe_lab_tier_1:0 "量子创研枢纽"
 tech_building_yuzu_fe_lab_tier_1_desc:0 "汇集最先进设备与空前人力规模的研究枢纽。量子理论在此不再只是被探讨的对象，而是被转化为可以落地的技术成果。"
 tech_building_yuzu_fe_lab_tier_2:0 "超验研理圣殿"
 tech_building_yuzu_fe_lab_tier_2_desc:0 "站在科学进步顶点的研究机构。它把“不可解”列入待办事项，见证着一个创造无远弗届的时代。"
 tech_building_yuzu_fe_lab_tier_3:0 "幽玄推演矩阵"
 tech_building_yuzu_fe_lab_tier_3_desc:0 "假说在演算矩阵中被成批地提出、推翻与重建；知识不再是缓慢的积累，而是一条可以被加速的产线。"
 tech_building_yuzu_fe_lab_tier_4:0 "赤曜真知圣所"
 tech_building_yuzu_fe_lab_tier_4_desc:0 "经过验证的规律在穹顶下凝结成可以反复调用的公理，全星的思维资源都在为同一批问题让路。"
 tech_building_yuzu_fe_lab_tier_5:0 "公理之枢"
 tech_building_yuzu_fe_lab_tier_5_desc:0 "文明所掌握的全部公理在此归档并可即时调用，研究流程本身已被压缩到接近极限。"
 tech_building_yuzu_fe_entertainment_tier_1:0 "虚境欢愉广场"
 tech_building_yuzu_fe_entertainment_tier_1_desc:0 "这片庞大的娱乐区段处于休闲产业的最前沿，脑波读取技术可为每位居民生成即时、个性化的虚拟度假体验。"
 tech_building_yuzu_fe_entertainment_tier_2:0 "极乐枢纽"
 tech_building_yuzu_fe_entertainment_tier_2_desc:0 "娱乐产业的顶峰。这座枢纽超越了常规限制，居民的所有愿望在许下之前就已经被实现。"
 tech_building_yuzu_fe_entertainment_tier_3:0 "幽梦欢愉圣殿"
 tech_building_yuzu_fe_entertainment_tier_3_desc:0 "梦境光幕覆盖各大厅，娱乐体验被编成可以反复回放的序列，进入者不再受疲劳影响。"
 tech_building_yuzu_fe_entertainment_tier_4:0 "赤霞极乐圣所"
 tech_building_yuzu_fe_entertainment_tier_4_desc:0 "愉悦不再需要被制造，只需要被允许；连行星的作息都为这场不散的庆典让开道路。"
 tech_building_yuzu_fe_entertainment_tier_5:0 "极乐终殿"
 tech_building_yuzu_fe_entertainment_tier_5_desc:0 "娱乐需求在整片城区被统一承接，愉悦的供给不再有上限，全星长期处于同一场庆典之中。"
