 tech_building_yuzu_dimensional_fabricator_tier_2:0 "多重次元制造机"
 tech_building_yuzu_dimensional_fabricator_tier_2_desc:0 "先进织造机不断隧连进维度空间的织构，基础战略资源呈洪流状产出，零素、暗物质、活体金属与纳米机器人亦自此稳定成型。"
